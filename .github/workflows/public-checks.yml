name: Public source checks

on:
  push:
    branches: [rust]
    # Normal merges already passed the required checks on the up-to-date PR.
    # Refresh branch-wide caches when the toolchain or build inputs change.
    paths:
      - '.github/workflows/public-checks.yml'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain*'
  pull_request:
    branches: [rust]
  workflow_dispatch:
    inputs:
      legacy_python_comparison:
        description: Run the archived Python server comparison tool tests
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gallery-preview-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Check native preview policy contract
        run: python3 -B scripts/check_gallery_preview_policy.py

  rust-protocol-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        features: [default, inspector, lua-debug]
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: protocol-${{ matrix.features }}
          save-if: ${{ github.ref == 'refs/heads/rust' }}
      - name: Check Rust formatting
        if: matrix.features == 'default'
        run: cargo +stable fmt --all -- --check
      - name: Lint Rust targets
        if: matrix.features == 'default'
        run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
      - name: Lint Inspector code
        if: matrix.features == 'inspector'
        run: cargo +stable clippy --locked -p orpheus --features inspector --lib -- -D warnings
      - name: Lint optional Lua override
        if: matrix.features == 'lua-debug'
        run: cargo +stable clippy --locked -p orpheus --all-targets --features lua-debug -- -D warnings
      - name: Run optional Lua override regressions
        if: matrix.features == 'lua-debug'
        run: cargo +stable test --locked -p orpheus --features lua-debug --lib --quiet
      - name: Run Rust protocol regressions
        if: matrix.features == 'default'
        run: |
          cargo +stable test --locked --color never --workspace --all-targets |
            Tee-Object -FilePath "$env:RUNNER_TEMP/orpheus-workspace-tests.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify shared contracts ran in the workspace suite
        if: matrix.features == 'default'
        run: |
          $required = @(
            'script_init::tests::shared_unkeyed_array_contract'
            'script_expr::tests::shared_engine_setting_contract'
            'script_entity_state::tests::shared_foreign_component_contract'
            'script_init::tests::shared_corpse_retirement_contract'
            'script_expr::tests::shared_velocity_contract'
            'script_init::tests::shared_contains_condition_contract'
            'script_expr::tests::shared_total_health_contract'
            'script_expr::tests::shared_hostile_filter_contract'
            'script_expr::tests::shared_combat_target_contract'
            'script_expr::tests::shared_ally_filter_contract'
            'script_expr::tests::shared_native_filter_tag_clauses'
            'script_init::tests::shared_voice_lifecycle_contract'
            'script_expr::tests::shared_body_field_contract'
            'script_expr::tests::shared_body_angle_contract'
            'script_expr::tests::shared_flashbang_filter_admission_contract'
            'script_expr::tests::shared_absent_target_filter_contract'
            'script_init::tests::shared_nested_destination_contract'
            'script_init::tests::shared_unbound_loadout_action_contract'
            'script_init::tests::shared_foreign_notification_contract'
            'script_init::tests::shared_spatial_owner_absence_contract'
            'script_init::tests::shared_ability_press_window_contract'
            'script_init::tests::shared_stack_admission_contract'
            'pve_encounter::voice::tests::shared_boss_speech_contract'
            'linked_aim::tests::shared_captured_aim_numeric_contract'
            'script_enemy::tests::shared_captured_aim_lifecycle_contract'
            'script_init_host_tests::tests::shared_charge_contract'
            'script_player::tests::shared_horizontal_cap_queues_on_a_live_player_without_a_roll_profile'
            'script_enemy::tests::shared_retired_entity_contract'
            'script_enemy::tests::shared_self_damage_clock_contract'
            'script_enemy::tests::shared_flashbang_effect_dispatch_contract'
            'script_enemy::tests::shared_flashbang_entry_guard_contract'
            'script_enemy::tests::shared_flashbang_exclusion_guard_contract'
            'script_init_host_tests::tests::shared_flashbang_base_state_contract'
            'script_enemy::tests::shared_flashbang_targeted_message_contract'
            'script_enemy::tests::shared_flashbang_velocity_action_contract'
            'game_bots::tests::shared_flashbang_horizontal_motion_contract'
            'script_init_host_tests::tests::shared_victory_view_route_contract'
            'script_player::tests::shared_deadeye_aim_ray_visibility_contract'
            'pve_encounter::validation::tests::shared_junkenstein_validation_contract'
            'game_replication::tests::shared_first_command_anchor_respects_body_and_existing_input_history'
            'jam_framing::tests::shared_framing_contract_survives_every_fragmentation'
            'strict_world_queries_match_shared_contract'
            'settings_cases_survive_save_and_reload'
            'direction_mod_turns_throttles'
            'server_only_motion_window_extends_and_retires_after_tail'
            'owner_and_observer_keep_first_stamp_until_ack'
            'immediate_wave_samples_zero_then_reach_and_finishes'
            'confirmation_publishes_static_destination_before_travel'
            'move_to_ignores_destination_outside_movement_axis_bounds'
          )
          $passed = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          foreach ($line in Get-Content -LiteralPath "$env:RUNNER_TEMP/orpheus-workspace-tests.txt") {
            if ($line -cmatch '^test (\S+) \.\.\. ok$') {
              [void]$passed.Add($Matches[1])
            }
          }
          $missing = @($required | Where-Object { -not $passed.Contains($_) })
          if ($missing.Count -gt 0) {
            throw "Required shared contract tests did not pass in the workspace run: $($missing -join ', ')"
          }

      - name: Test Inspector-only behavior
        if: matrix.features == 'inspector'
        run: |
          cargo +stable test --locked --color never -p orpheus -p orpheus-statescript --features orpheus/inspector --lib --test runtime_preflight -- debug_http::tests:: owner_trace::tests:: debug_control_requires_debug_port_before_startup node_observation_limit_counts_only_distinct_sites |
            Tee-Object -Variable inspectorOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($pattern in @(
            '^test debug_http::tests::\S+ \.\.\. ok$'
            '^test owner_trace::tests::\S+ \.\.\. ok$'
            '^test debug_control_requires_debug_port_before_startup \.\.\. ok$'
            '^test \S+::node_observation_limit_counts_only_distinct_sites \.\.\. ok$'
          )) {
            if (-not ($inspectorOutput -cmatch $pattern)) {
              throw "Inspector tests missing from the run: $pattern"
            }
          }

  rust-msrv:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.85.0 --profile minimal
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/rust' }}
      - name: Check workspace on minimum supported Rust
        run: cargo +1.85.0 check --locked --workspace --all-targets --features inspector

  rust-portable-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: linux-workspace
          save-if: ${{ github.ref == 'refs/heads/rust' }}
      - name: Check default workspace build on Linux
        run: cargo +stable check --locked --workspace
      - name: Test Linux filesystem and UDP worker behavior
        run: |
          set -o pipefail
          cargo +stable test --locked --color never -p orpheus --lib -- --exact \
            accounts::tests::accounts_keep_nicknames_and_identity_across_restarts \
            game_service::tests::isolation::encrypted_worker_satisfies_room_recovery_contract \
            | tee "$RUNNER_TEMP/linux-tests.txt"
          grep -Fx 'test accounts::tests::accounts_keep_nicknames_and_identity_across_restarts ... ok' "$RUNNER_TEMP/linux-tests.txt"
          grep -Fx 'test game_service::tests::isolation::encrypted_worker_satisfies_room_recovery_contract ... ok' "$RUNNER_TEMP/linux-tests.txt"

  shared-behavior-contracts:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Check out pinned Python contract consumer
        uses: actions/checkout@v6.0.2
        with:
          repository: leafall903/ORPHEUS
          ref: b28139d4fa230480c0cea147d369724f97569c30
          path: python-reference
          persist-credentials: false
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - name: Check Rust tooling
        run: >-
          python -B -m unittest
          scripts.tests.test_receiver_convergence
          scripts.tests.test_runtime_state_metadata
          scripts.tests.test_model_hardpoints
          scripts.tests.test_runtime_entrypoint
          scripts.tests.test_runtime_projectiles
          scripts.tests.test_runtime_rulesets
          scripts.tests.test_runtime_validation
          scripts.tests.test_runtime_tools
          scripts.tests.test_zero_private_inputs
          scripts.tests.test_statescript_coverage
          scripts.tests.test_statescript_evidence
          scripts.tests.test_statescript_scaffold
      - name: Check the pinned wire reader
        env:
          ORPHEUS_PYTHON_REFERENCE: ${{ github.workspace }}/python-reference
        run: |
          python -I -S -B -m unittest discover -s scripts/tests -p "test_sprint_wire.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -S -B -m unittest discover -s scripts/tests -p "test_state_link_wire.py"
          exit $LASTEXITCODE
      - name: Check archived Python server comparison tools
        if: github.event_name == 'workflow_dispatch' && inputs.legacy_python_comparison
        run: >-
          python -B -m unittest
          scripts.tests.test_compare_actor_startup
          scripts.tests.test_golden_inputs
      - name: Check Python against this Rust checkout's fixture
        working-directory: python-reference
        env:
          PYTHONPATH: ${{ github.workspace }}/python-reference/src;${{ github.workspace }}/python-reference
          ORPHEUS_BEHAVIOR_FIXTURES: ${{ github.workspace }}/fixtures/behavior
          ORPHEUS_RUNTIME_DIR: ""
        run: python -S -B -m unittest tests.public.test_behavior_contracts tests.public.test_world_query_contracts tests.public.test_profile_settings_contracts -v
