name: Public source checks

on:
  push:
    branches: [rust]
  pull_request:
    branches: [rust]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-protocol-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        features: [default, inspector]
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check Rust formatting and lint
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy --locked --workspace --all-targets --features "${{ matrix.features }}" -- -D warnings
      - name: Run Rust protocol regressions
        run: cargo +stable test --locked --workspace --all-targets --features "${{ matrix.features }}"

  rust-msrv:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check workspace on minimum supported Rust
        run: cargo +1.85.0 check --locked --workspace --all-targets --features inspector

  rust-portable-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal
      - name: Run portable crate regressions
        run: cargo +stable test --locked --all-targets -p orpheus-collision -p orpheus-runtime -p orpheus-wire
