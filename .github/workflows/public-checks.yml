name: Public source checks

on:
  push:
    branches: [rust]
  pull_request:
    branches: [rust]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gallery-preview-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Check native preview policy contract
        run: python3 -B scripts/check_gallery_preview_policy.py

  rust-protocol-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        features: [default, inspector]
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check Rust formatting and lint
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy --locked --workspace --all-targets --features "${{ matrix.features }}" -- -D warnings
      - name: Run Rust protocol regressions
        run: cargo +stable test --locked --workspace --all-targets --features "${{ matrix.features }}"
      - name: Check shared StateScript contracts
        run: |
          foreach ($contract in @('script_init::tests::shared_unkeyed_array_contract', 'script_expr::tests::shared_engine_setting_contract', 'script_entity_state::tests::shared_foreign_component_contract', 'script_init::tests::shared_corpse_retirement_contract', 'script_expr::tests::shared_velocity_contract', 'script_init::tests::shared_contains_condition_contract', 'script_expr::tests::shared_total_health_contract', 'script_expr::tests::shared_hostile_filter_contract', 'script_expr::tests::shared_combat_target_contract', 'script_expr::tests::shared_ally_filter_contract', 'script_expr::tests::shared_native_filter_tag_clauses', 'script_init::tests::shared_voice_lifecycle_contract', 'junkenstein_voice::tests::shared_boss_speech_contract', 'script_expr::tests::shared_body_field_contract', 'script_expr::tests::shared_body_angle_contract', 'linked_aim::tests::shared_captured_aim_numeric_contract', 'script_enemy::tests::shared_captured_aim_lifecycle_contract', 'script_init::tests::shared_charge_contract', 'script_enemy::tests::shared_retired_entity_contract', 'script_enemy::tests::shared_self_damage_clock_contract', 'script_enemy::tests::shared_flashbang_effect_dispatch_contract', 'script_enemy::tests::shared_flashbang_entry_guard_contract', 'script_enemy::tests::shared_flashbang_exclusion_guard_contract', 'script_expr::tests::shared_flashbang_filter_admission_contract', 'script_expr::tests::shared_absent_target_filter_contract', 'script_init::tests::shared_nested_destination_contract', 'script_init::tests::shared_unbound_loadout_action_contract', 'script_init::tests::shared_flashbang_base_state_contract', 'script_enemy::tests::shared_flashbang_targeted_message_contract', 'script_enemy::tests::shared_flashbang_velocity_action_contract', 'game_bots::tests::shared_flashbang_horizontal_motion_contract', 'script_init::tests::shared_foreign_notification_contract', 'script_init::tests::shared_victory_view_route_contract', 'script_init::tests::shared_spatial_owner_absence_contract', 'script_init::tests::shared_ability_press_window_contract', 'script_init::tests::shared_stack_admission_contract', 'script_player::tests::shared_deadeye_aim_ray_visibility_contract', 'junkenstein_validation::tests::shared_junkenstein_validation_contract')) {
            $inventory = cargo +stable test --locked --lib --features "${{ matrix.features }}" $contract -- --list
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($inventory -notcontains "${contract}: test") { throw "Shared contract test is missing: $contract" }
            cargo +stable test --locked --lib --features "${{ matrix.features }}" $contract -- --exact
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  rust-msrv:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check workspace on minimum supported Rust
        run: cargo +1.85.0 check --locked --workspace --all-targets --features inspector

  rust-portable-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal
      - name: Run portable crate regressions
        run: cargo +stable test --locked --all-targets -p orpheus-collision -p orpheus-runtime -p orpheus-wire

  shared-behavior-contracts:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Check out pinned Python contract consumer
        uses: actions/checkout@v6.0.2
        with:
          repository: leafall903/ORPHEUS
          ref: b17265556637302e8475e2f69a3d862b57953858
          path: python-reference
          persist-credentials: false
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - name: Check Python against this Rust checkout's fixture
        working-directory: python-reference
        env:
          PYTHONPATH: ${{ github.workspace }}/python-reference/src
          ORPHEUS_BEHAVIOR_FIXTURES: ${{ github.workspace }}/fixtures/behavior
          ORPHEUS_RUNTIME_DIR: ""
        run: python -S -B -m unittest tests.public.test_behavior_contracts tests.public.test_world_query_contracts -v
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal
      - name: Check Rust against the same fixture
        shell: bash
        run: |
          contract=jam_framing::tests::shared_framing_contract_survives_every_fragmentation
          cargo +stable test --locked -p orpheus-wire "$contract" -- --list > contract-tests.txt
          python -c 'from pathlib import Path; import sys; assert sys.argv[1] + ": test" in Path("contract-tests.txt").read_text().splitlines(), "shared contract test is missing"' "$contract"
          cargo +stable test --locked -p orpheus-wire "$contract" -- --exact
      - name: Check strict World queries against the same fixture
        run: cargo +stable test --locked -p orpheus --test world_queries
