[workspace]
members = [
    "rust/crates/collision",
    "rust/crates/golden-trace",
    "rust/crates/runtime",
    "rust/crates/statescript",
    "rust/crates/wire",
]
default-members = [
    ".",
    "rust/crates/collision",
    "rust/crates/golden-trace",
    "rust/crates/runtime",
    "rust/crates/statescript",
    "rust/crates/wire",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.lints.rust]
elided_lifetimes_in_paths = "warn"
meta_variable_misuse = "warn"
redundant_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "forbid"
unused_import_braces = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
flat_map_option = "warn"
fn_to_numeric_cast_any = "warn"
inefficient_to_string = "warn"
mem_forget = "warn"
mutex_atomic = "warn"
needless_pass_by_ref_mut = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
todo = "warn"
unimplemented = "warn"
verbose_file_reads = "warn"

[package]
name = "orpheus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Server reimplementation for Overwatch 1.74"

[lints]
workspace = true

[lib]
path = "rust/src/lib.rs"

[[bin]]
name = "orpheus_server"
path = "rust/src/bin/orpheus_server.rs"

[[bin]]
name = "orpheus_proton"
path = "rust/src/bin/orpheus_proton.rs"

[[test]]
name = "runtime_preflight"
path = "rust/tests/runtime_preflight.rs"

[[test]]
name = "protocol"
path = "rust/tests/protocol.rs"

[[test]]
name = "world_queries"
path = "rust/tests/world_queries.rs"

[[test]]
name = "profile_settings"
path = "rust/tests/profile_settings.rs"

[[test]]
name = "server_only_movement"
path = "rust/tests/server_only_movement.rs"

[[test]]
name = "body_short_action_retry"
path = "rust/tests/body_short_action_retry.rs"

[[test]]
name = "wrecking_ball"
path = "rust/tests/wrecking_ball.rs"

[[test]]
name = "seismic_slam"
path = "rust/tests/seismic_slam.rs"

[[bench]]
name = "script_actions"
path = "rust/benches/script_actions.rs"
harness = false

[dev-dependencies]
criterion = { version = "=0.7.0", default-features = false, features = ["cargo_bench_support"] }

[features]
default = []
lua-mods = ["dep:mlua"]
lua-debug = ["lua-mods"]
inspector = ["dep:httparse", "orpheus-statescript/node-observations"]
script-coverage = ["inspector", "orpheus-statescript/extended-node-observations"]

[dependencies]
bevy_ecs = { version = "0.16.1", default-features = false, features = ["std"] }
crc32fast = "1"
flate2 = "1.1"
getrandom = "0.3"
hmac = "0.12"
httparse = { version = "1", optional = true }
indexmap = { version = "2", features = ["serde"] }
mio = { version = "1.1.1", features = ["net", "os-poll"] }
mlua = { version = "=0.11.6", default-features = false, features = ["lua54", "vendored", "send"], optional = true }
orpheus-collision = { path = "rust/crates/collision" }
orpheus-runtime = { path = "rust/crates/runtime" }
orpheus-statescript = { path = "rust/crates/statescript" }
orpheus-wire = { path = "rust/crates/wire" }
prost = "0.14"
prost-reflect = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

[profile.dev]
debug = false

[profile.test]
debug = false

[profile.dev.package."*"]
opt-level = 2

[profile.playtest]
inherits = "release"
opt-level = 2
codegen-units = 256
incremental = true
debug = false
